version: "3.8"

services:
  falcon_bot:
    user: "0:0"
    build: .
    container_name: falcon_kibertexnology_school_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./exports:/app/exports
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
